<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .container {
        display: flex;
        background-color: brown;
      }

      .container div {
        background-color: aqua;
        padding: 10px;
        margin: 20px;
        font-size: large;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }

      .container2 {
        display: flex;
        flex-wrap: wrap;
        padding: 0 4px;
      }

      /* membuat 4 kolom dengan ukuran sams berjajar satu sama lain */
      .column {
        flex: 25%;
        max-width: 25%;
        padding: 0 4px;
      }

      .column img {
        margin-top: 8px;
        vertical-align: middle;
      }

      /* layout responsif - membuat 2 kolom alih alih 4 kolom */
      @media screen and (max-width: 800px) {
        .column {
          flex: 50%;
          max-width: 50%;
        }
      }

      /* layout responsif - membuat 2 kolom bertumpuk dari atas satu sama lain alih alih berdampingan */
      @media screen and (max-width: 600px) {
        .column {
          flex: 100%;
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1 style="display: flex; justify-content: center">Gallery</h1>
    <div style="display: flex; justify-content: center; align-items: center">
      <a href="index.html">

    <br />

      <span style="margin-left: 15px"></span>

</html>
