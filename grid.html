<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>

    <style>
      .container {
        background-color: aqua;
        display: grid;
        grid-template-columns: auto auto auto auto;
        padding: 10px;
        gap: 5px;
      }

      .container div {
        background-color: antiquewhite;
        font-size: 30px;
        text-align: center;
      }
      .container2 {
        background-color: blue;
        padding: 10px;
        gap: 20px;
        display: grid;
        grid-template-columns: 80px 100px auto;
      }
      .container2 div {
        background-color: aliceblue;
        text-align: center;
        height: 60px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
    </div>

    <div class="container2">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
    </div>
  </body>
</html>
